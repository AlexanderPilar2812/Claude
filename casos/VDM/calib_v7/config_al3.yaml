# Calibración ZP-05 con los días medidos 12–15/09 (hora 0 del INP = 10/09 00:00).
# Sin modificar patrones de demanda ni rugosidades.
name: VDM_v7
inp: Mod_VDM_v7_base.inp
output_dir: resultados_al3
workers: 0
epanet_version: "2.2"

groups:
  VRP_3949706:   {select: {ids: [3949706_n2a]}}
  TCV_P11:       {select: {ids: [3949364_n2a]}}
  DEM_Z3949706:  {select: {ids_file: zonas.csv, group: Z_VRP3949706}}
  DEM_RESTO:     {select: {ids_file: zonas.csv, group: RESTO}}

observations:
  files:
    - {file: calibr_caudal_12-15_al3.dat,  type: FLOW}
    - {file: calibr_presion_12-15_al3.dat, type: PRESSURE}
  start: "2026-09-10 00:15:00"
  step: 900
  warmup: 0

hydraulic:
  objectives: [PRESSURE, FLOW]
  metric: rmse
  parameters:
    - {group: VRP_3949706,  type: valve_setting,     mode: offset, bounds: [-8.0, 3.0]}
    - {group: TCV_P11,      type: valve_setting,     bounds: [0.0, 3000.0]}
    - {group: DEM_Z3949706, type: demand_multiplier, bounds: [0.4, 1.3]}
    - {group: DEM_RESTO,    type: demand_multiplier, bounds: [0.7, 1.3]}
  sensitivity: {enabled: true, freeze_below: 0.01}
  optimizer: {goal: pareto, pop_size: 24, n_gen: 16, seed: 1, stall_gens: 5, max_front: 12}
  selection: knee
  local_search: {enabled: true, max_iter: 10}

acceptance:
  - {name: CAUDAL,  kind: FLOW,     error: relative, threshold: 15, timesteps_pct: 75, points_pct: 100}
  - {name: PRESION, kind: PRESSURE, error: absolute, threshold: 5,  timesteps_pct: 80, points_pct: 80}

workflow:
  mode: hydraulic
